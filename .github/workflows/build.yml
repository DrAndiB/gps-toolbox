name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch Gradle (with retries)
        run: |
          for i in 1 2 3 4 5; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $i), retrying in 20 s"
            sleep 20
          done
          exit 1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the private signing key from repository secrets."
          else
            echo "No signing secrets set: using the committed CI key."
          fi

      - name: Unit tests and release build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "gps-toolbox-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gps-toolbox-apk
          path: gps-toolbox-*.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="build-${{ github.run_number }}"
          printf 'Automatic build of %s\n\n%s\n' "${GITHUB_SHA::7}" "$COMMIT_MSG" > notes.md
          gh release create "$TAG" "gps-toolbox-${{ github.run_number }}.apk" \
            --target "$GITHUB_SHA" \
            --title "GPS Toolbox build ${{ github.run_number }}" \
            --notes-file notes.md \
            --latest
          # Keep only the five newest builds.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
